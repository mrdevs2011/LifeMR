<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-ins</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0c;
    --border: #1f2422;
    --text: #e4e9e6;
    --text-dim: #6b7570;
    --red: #ef6a6a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }
  h1 {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dim);
    margin: 0 0 28px;
    letter-spacing: .02em;
  }
  .entry {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
    line-height: 1.5;
  }
  .entry:first-child { border-top: 1px solid var(--border); }
  .ts {
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
    width: 140px;
  }
  .holat {
    color: var(--text);
    word-break: break-word;
  }
  .state {
    color: var(--text-dim);
    font-size: 14px;
    padding: 8px 0;
  }
  .state.err { color: var(--red); }
  @media (max-width: 520px) {
    .entry { flex-direction: column; gap: 4px; }
    .ts { width: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>checkins</h1>
  <div id="log">
    <div class="state">yuklanmoqda...</div>
  </div>
</div>

<script>
  const PROJECT_ID = "mrabout";
  const API_KEY = "AIzaSyAvvkcbKlbrplbh29m2MmVfiypvlGAEglg";
  const URL_ = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/default/documents/checkins?pageSize=300&key=${API_KEY}`;

  function esc(s) {
    const d = document.createElement('div');
    d.innerText = s;
    return d.innerHTML;
  }

  async function load() {
    const logEl = document.getElementById('log');
    try {
      const res = await fetch(URL_);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const docs = data.documents || [];

      docs.sort((a, b) => {
        const ta = a.fields?.timestamp?.timestampValue || a.createTime || '';
        const tb = b.fields?.timestamp?.timestampValue || b.createTime || '';
        return tb.localeCompare(ta);
      });

      if (docs.length === 0) {
        logEl.innerHTML = `<div class="state">hali yozuv yo'q.</div>`;
        return;
      }

      logEl.innerHTML = docs.map(d => {
        const f = d.fields || {};
        const vaqt = f.vaqt?.stringValue || '';
        const holat = f.holat?.stringValue || '';
        return `<div class="entry"><div class="ts">${esc(vaqt)}</div><div class="holat">${esc(holat)}</div></div>`;
      }).join('');
    } catch (e) {
      logEl.innerHTML = `<div class="state err">xato: ma'lumot yuklanmadi (${esc(e.message)})</div>`;
    }
  }

  load();
</script>
</body>
</html>
