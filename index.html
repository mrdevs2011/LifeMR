<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MRstatus</title>
<meta name="application-name" content="MRstatus">
<meta name="apple-mobile-web-app-title" content="MRstatus">
<meta name="theme-color" content="#0a0c0b">
<meta name="description" content="MRstatus">
<link rel="icon" type="image/svg+xml" href="/logo/logo.svg">
<link rel="alternate icon" type="image/x-icon" sizes="48x48" href="/logo/logo.ico">
<link rel="apple-touch-icon" href="/logo/logo-180.png">
<link rel="manifest" href="/logo/site.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0b;
    --panel: #101413;
    --border: #202826;
    --border-soft: #171c1a;
    --text: #eef2ef;
    --text-dim: #7c8883;
    --text-faint: #4c5652;
    --accent: #7fe0a0;
    --accent-dim: rgba(127, 224, 160, .1);
    --red: #f2726f;
    --red-dim: rgba(242, 114, 111, .1);
    --radius: 6px;
    --radius-sm: 4px;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html {
    /* fluid type scale — ekran kengligiga qarab silliq o'sadi/kichrayadi,
       qat'iy breakpoint'larga tayanmasdan har qanday device'da tekis ko'rinadi */
    font-size: clamp(14px, 3.4vw, 15.5px);
  }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-text-size-adjust: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(127, 224, 160, .05), transparent 60%),
      var(--bg);
  }

  ::selection { background: var(--accent-dim); color: var(--accent); }

  a, button, input, .day-row { -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .page {
    max-width: 700px;
    margin: 0 auto;
    padding: clamp(16px, 4vw, 40px) clamp(10px, 3vw, 20px) clamp(28px, 5vw, 48px);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 18px 44px -22px rgba(0, 0, 0, .6);
    padding: 0;
    overflow: hidden;
  }

  .card-body {
    padding: 16px 20px 20px;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(255, 255, 255, .012);
  }


  .badge { width: 19px; height: 19px; border-radius: 5px; flex-shrink: 0; display: block; }

  h1 {
    display: flex;
    align-items: baseline;
    gap: 7px;
    font-size: .88rem;
    font-weight: 500;
    color: var(--text-dim);
    margin: 0 auto 0 5px;
    letter-spacing: 0;
  }
  h1 b { color: var(--text); font-weight: 600; }
  h1 .path { color: var(--text-faint); }

  .live-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-dim);
    flex-shrink: 0;
    animation: pulse 2.4s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(127, 224, 160, .35); }
    70%  { box-shadow: 0 0 0 7px rgba(127, 224, 160, 0); }
    100% { box-shadow: 0 0 0 0 rgba(127, 224, 160, 0); }
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 7px;
  }

  .inp {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: .88rem;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .15s ease;
  }
  .inp::placeholder { color: var(--text-faint); }
  .inp:hover { border-color: var(--text-faint); }
  .inp:focus { border-color: var(--accent); }

  button {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: .85rem;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color .15s ease, transform .08s ease;
  }
  button:hover { background: var(--accent); color: #08130c; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; transform: none; }

  #loginForm { flex-direction: column; margin: 0; }
  .linkbtn {
    background: none; border: none; padding: 0; color: var(--text-dim);
    font-size: inherit; font-weight: 500; text-decoration: underline; cursor: pointer;
  }
  .linkbtn:hover { color: var(--text); opacity: 1; }

  #gate button, #gate input { width: 100%; }
  #gate button {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border);
  }
  #gate button:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

  .divider {
    height: 1px;
    background: var(--border-soft);
    margin: 10px 0 2px;
  }

  .day { border-bottom: 1px solid var(--border-soft); font-size: .88rem; }
  .day:last-child { border-bottom: none; }

  .day-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 5px;
    margin: 0 -5px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: background-color .15s ease;
  }
  .day-row:hover { background: rgba(255, 255, 255, .025); }
  .day-row:active { background: rgba(255, 255, 255, .045); }

  .day-date {
    color: var(--text);
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: 0;
    white-space: nowrap;
  }
  .day.open .day-date { color: var(--accent); }

  .day-count {
    color: var(--text-faint);
    font-size: .72rem;
    flex: 1;
  }

  .day-arrow {
    color: var(--text-faint);
    font-size: .78rem;
    transition: transform .25s ease, color .15s ease;
    flex-shrink: 0;
  }
  .day.open .day-arrow { transform: rotate(90deg); color: var(--accent); }

  .day-entries {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    padding-bottom: 4px;
    transition: max-height .32s cubic-bezier(.4, 0, .2, 1), opacity .28s ease;
  }
  .day.open .day-entries { opacity: 1; }

  .entry {
    display: flex;
    gap: 10px;
    padding: 4px 0 4px 10px;
    border-left: 2px solid var(--border);
    margin-left: 3px;
    font-size: .78rem;
    line-height: 1.4;
  }

  .ts {
    color: var(--text-faint);
    white-space: nowrap;
    flex-shrink: 0;
    width: 40px;
    font-variant-numeric: tabular-nums;
  }

  .holat {
    color: var(--text);
    word-break: break-word;
    min-width: 0;
  }

  .state {
    color: var(--text-dim);
    font-size: .75rem;
    padding: 5px 4px;
  }
  .state.err { color: var(--red); }
  .state.ok { color: var(--accent); }
  .hint { font-size: .68rem; color: var(--text-faint); padding-top: 8px; }


  /* ---- odat qatlami: kunlik ritm, eslatma, tez yozish ---- */
  .week { margin: 0 0 10px; }
  .week-dots { display: flex; gap: 5px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; }
  .wd i {
    width: 100%; max-width: 34px; height: 6px; border-radius: 3px;
    background: var(--border-soft); border: 1px solid var(--border);
    transition: background-color .25s ease, border-color .25s ease;
  }
  .wd.on i { background: var(--accent); border-color: var(--accent); }
  .wd.today i { border-color: var(--text-dim); }
  .wd.today.on i { border-color: var(--accent); }
  .wd.pop i { animation: pop .5s ease-out; }
  .wd span { font-size: .6rem; color: var(--text-faint); }
  .wd.today span { color: var(--text-dim); }
  @keyframes pop { 0% { transform: scaleY(1); } 40% { transform: scaleY(1.9); } 100% { transform: scaleY(1); } }
  .week-note { margin-top: 5px; font-size: .7rem; color: var(--text-dim); min-height: 1.2em; }

  .nudge {
    margin: 0 0 8px; padding: 6px 9px; font-size: .74rem; color: var(--accent);
    background: var(--accent-dim); border: 1px solid rgba(127, 224, 160, .25); border-radius: var(--radius-sm);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }
  .chip {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    font-size: .68rem; font-weight: 500; padding: 3px 7px; border-radius: var(--radius-sm);
  }
  .chip:hover { border-color: var(--text-faint); color: var(--text); opacity: 1; }
  .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .chips.energy { align-items: center; }
  .chips.energy .lbl { font-size: .68rem; color: var(--text-faint); margin-right: 2px; }
  .chips.energy .chip { min-width: 26px; text-align: center; }

  #gate {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px 14px;
  }

  #content { display: none; }

  /* ---- tab'lar ---- */
  .tabs { display: flex; gap: 3px; padding: 10px 14px 0; }
  .tab {
    background: transparent; border: 1px solid transparent; color: var(--text-faint);
    font-family: inherit; font-size: .8rem; font-weight: 600; letter-spacing: .01em;
    padding: 6px 13px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; cursor: pointer;
  }
  .tab:hover { color: var(--text-dim); }
  .tab.active { color: var(--accent); background: rgba(127, 224, 160, .06); border-color: var(--border-soft); border-bottom-color: transparent; }
  .tab-line { height: 1px; background: var(--border-soft); margin: 0 14px; }

  /* ---- dars jadvali: ixcham grid, katakka bosib to'g'ridan-to'g'ri tahrirlanadi ---- */
  .grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -3px; }
  table.jadval { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .82rem; }
  table.jadval th, table.jadval td { border: 1px solid var(--border-soft); padding: 0; }
  table.jadval th {
    background: rgba(255, 255, 255, .02); color: var(--text-dim); font-weight: 600;
    font-size: .7rem; letter-spacing: .02em; text-transform: uppercase;
    padding: 8px 8px; text-align: left; white-space: nowrap;
  }
  td.rownum {
    color: var(--text-faint); text-align: center; width: 24px;
    background: rgba(255, 255, 255, .012); font-variant-numeric: tabular-nums; font-size: .76rem;
  }
  .cell {
    min-width: 78px; padding: 7px 8px; color: var(--text); outline: none; cursor: text;
    white-space: pre-wrap; word-break: break-word; line-height: 1.4; min-height: 1.4em;
    transition: background-color .12s ease;
  }
  .cell:hover { background: rgba(255, 255, 255, .02); }
  .cell:focus { background: var(--accent-dim); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell:empty::before { content: "\2014"; color: var(--text-faint); }
  .jadval-state { font-size: .74rem; color: var(--text-faint); padding: 9px 5px 0; min-height: 1.3em; }
  .jadval-state.saving { color: var(--text-dim); }
  .jadval-state.saved { color: var(--accent); }
  .jadval-state.err { color: var(--red); }

  @media (max-width: 420px) {
    .entry { flex-direction: column; gap: 2px; padding-left: 10px; }
    .ts { width: auto; }
    .day-count { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="topbar">
      <img class="badge" src="/logo/logo.svg" alt="" width="16" height="16">
      <h1><b>mrstatus</b><span class="path">~/status</span><span class="live-dot" aria-hidden="true"></span></h1>
    </div>

    <div id="gate">
      <div class="state" id="gateState">tekshirilmoqda...</div>
      <form id="loginForm" style="display:none" autocomplete="off">
        <input type="email" class="inp" id="emailInput" placeholder="Email" autocomplete="off" required>
        <input type="password" class="inp" id="passInput" placeholder="Parol" autocomplete="off" required>
        <button type="submit" id="passBtn">Kirish</button>
      </form>
    </div>

    <div id="content">
      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-tab="status">status</button>
        <button type="button" class="tab" data-tab="jadval">jadval</button>
      </div>
      <div class="tab-line"></div>

      <div class="card-body" id="panelStatus">
      <div class="week" id="week" hidden>
        <div class="week-dots" id="weekDots"></div>
        <div class="week-note" id="weekNote"></div>
      </div>
      <div class="nudge" id="nudge" hidden></div>

      <form id="statusForm">
        <input type="text" class="inp" id="holatInput" placeholder="holatingni yoz..." autocomplete="off" maxlength="490" required>
        <button type="submit" id="submitBtn">yubor</button>
      </form>
      <div class="chips" id="phraseChips">
        <button type="button" class="chip" data-t="kod yozyapman">kod yozyapman</button>
        <button type="button" class="chip" data-t="yangi loyiha ustidaman">yangi loyiha</button>
        <button type="button" class="chip" data-t="dam olyapman">dam olyapman</button>
        <button type="button" class="chip" data-t="maktabdan keldim">maktabdan keldim</button>
        <button type="button" class="chip" data-t="charchadim">charchadim</button>
      </div>
      <div class="chips energy" id="energyChips" role="group" aria-label="energiya">
        <span class="lbl">energiya</span>
        <button type="button" class="chip" data-e="1">1</button>
        <button type="button" class="chip" data-e="2">2</button>
        <button type="button" class="chip" data-e="3">3</button>
        <button type="button" class="chip" data-e="4">4</button>
        <button type="button" class="chip" data-e="5">5</button>
      </div>

      <div id="formState" class="state"></div>
      <div class="divider"></div>
      <div id="log">
        <div class="state">yuklanmoqda...</div>
      </div>
      <div class="state hint">kun ustiga bosilsa, o'sha kun statuslari ochiladi · <button type="button" id="logoutBtn" class="linkbtn">chiqish</button></div>
      </div>

      <div class="card-body" id="panelJadval" hidden>
        <div class="grid-wrap">
          <table class="jadval">
            <thead>
              <tr>
                <th></th>
                <th title="Dushanba">Dush</th>
                <th title="Seshanba">Sesh</th>
                <th title="Chorshanba">Chor</th>
                <th title="Payshanba">Pay</th>
                <th title="Juma">Jum</th>
                <th title="Shanba">Shan</th>
              </tr>
            </thead>
            <tbody id="jadvalBody"></tbody>
          </table>
        </div>
        <div class="jadval-state" id="jadvalState"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const logEl = document.getElementById('log');
  const formEl = document.getElementById('statusForm');
  const inputEl = document.getElementById('holatInput');
  const btnEl = document.getElementById('submitBtn');
  const formStateEl = document.getElementById('formState');
  const contentEl = document.getElementById('content');
  const gateEl = document.getElementById('gate');
  const gateStateEl = document.getElementById('gateState');
  const passInputEl = document.getElementById('passInput');
  const passBtnEl = document.getElementById('passBtn');
  const emailInputEl = document.getElementById('emailInput');
  const loginFormEl = document.getElementById('loginForm');
  const logoutBtnEl = document.getElementById('logoutBtn');

  function esc(s) {
    const d = document.createElement('div');
    d.innerText = s;
    return d.innerHTML;
  }

  // ---- ODAT QATLAMI ----
  // Kun chegarasi (guide bilan bir xil): 00:00-04:59 dagi yozuv oldingi kunning davomi.
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const WD = ['Y', 'D', 'S', 'C', 'P', 'J', 'S']; // yak, dush, sesh, chor, pay, jum, shan

  function logicalDay(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (d.getHours() < 5) x.setDate(x.getDate() - 1);
    return x;
  }

  function dayKeyOf(vaqt) {
    const m = /^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/.exec(vaqt || '');
    if (!m) return null;
    return ymd(logicalDay(new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5])));
  }

  let prevTodayHas = null; // bugungi nuqta yangi to'lganda bir marta animatsiya qilish uchun

  function updateHabit(docs) {
    const weekEl = document.getElementById('week');
    const dotsEl = document.getElementById('weekDots');
    const noteEl = document.getElementById('weekNote');
    const nudgeEl = document.getElementById('nudge');
    const now = new Date();

    // kunlar bo'yicha sanash + energiya belgilari (:1-:5)
    const perDay = new Map();
    const marks = new Map(); // kun -> [energiya]
    for (const d of docs) {
      const f = d.data();
      const k = dayKeyOf(f.vaqt);
      if (!k) continue;
      perDay.set(k, (perDay.get(k) || 0) + 1);
      const m = /\s:([1-5])\s*$/.exec(f.holat || '');
      if (m) { if (!marks.has(k)) marks.set(k, []); marks.get(k).push(+m[1]); }
    }

    // oxirgi 7 mantiqiy kun (eskisi chapda, bugun o'ngda)
    const today = logicalDay(now);
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      days.push({ key: ymd(d), wd: WD[d.getDay()], isToday: i === 0 });
    }
    const todayHas = (perDay.get(days[6].key) || 0) > 0;
    dotsEl.innerHTML = days.map(x => {
      const on = (perDay.get(x.key) || 0) > 0;
      const pop = x.isToday && on && prevTodayHas === false ? ' pop' : '';
      return `<div class="wd${on ? ' on' : ''}${x.isToday ? ' today' : ''}${pop}" title="${x.key}"><i></i><span>${x.wd}</span></div>`;
    }).join('');
    prevTodayHas = todayHas;

    const n = days.filter(x => perDay.get(x.key)).length;
    const vals = days.flatMap(x => marks.get(x.key) || []);
    let note = `${n}/7 kun`;
    if (vals.length >= 3) note += ` · energiya ~${(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1)}`;
    noteEl.textContent = note;
    weekEl.hidden = false;

    // eslatma: faqat sening tanish paytlaringda (maktabdan keyin, kech kechqurun), bosimsiz
    let last = null;
    if (docs.length) {
      const ts = docs[0].data().timestamp;
      last = ts && ts.toDate ? ts.toDate() : now;
    }
    const hrs = last ? (now - last) / 36e5 : Infinity;
    const h = now.getHours();
    let msg = '';
    if (now.getDay() !== 0 && h >= 13 && h < 17 && hrs > 4) msg = 'uyga keldingmi? bitta holat yoz.';
    else if (h >= 20 && h < 23 && hrs > 3) msg = 'kunni yopamiz: bitta jumla yoz.';
    nudgeEl.hidden = !msg;
    nudgeEl.textContent = msg;
  }

  // tez yozish: tugmalar inputni to'ldiradi, energiya belgisi yuborishda ' :N' bo'lib qo'shiladi
  let energy = 0;
  document.getElementById('phraseChips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const inp = document.getElementById('holatInput');
    inp.value = inp.value.trim() ? `${inp.value.trim()}, ${b.dataset.t}` : b.dataset.t;
    inp.focus();
  });
  document.getElementById('energyChips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const v = +b.dataset.e;
    energy = energy === v ? 0 : v;
    document.querySelectorAll('#energyChips .chip').forEach(c => c.classList.toggle('on', +c.dataset.e === energy));
    document.getElementById('holatInput').focus();
  });
  function resetEnergy() {
    energy = 0;
    document.querySelectorAll('#energyChips .chip').forEach(c => c.classList.remove('on'));
  }

  // Bir vaqtda faqat bitta kun ochiq turadi (accordion).
  // openSana = hozir ochiq turgan kunning sanasi, yoki hech qaysi ochiq bo'lmasa null.
  let openSana = null;
  let dayObserver = null;

  // Kunni animatsiya bilan ochish: max-height ni 0 dan haqiqiy balandlikkacha o'tkazamiz —
  // shunda transition CSS'dagi "smooth" effekt beradi, sakrash bo'lmaydi.
  function openDay(dayEl) {
    const entries = dayEl.querySelector('.day-entries');
    dayEl.classList.add('open');
    entries.style.maxHeight = entries.scrollHeight + 'px';
  }

  // Kunni animatsiya bilan yopish.
  function closeDay(dayEl) {
    const entries = dayEl.querySelector('.day-entries');
    // avval hozirgi balandlikni "qattiq" raqam qilib qo'yamiz (auto emas),
    // shundagina 0 ga transition silliq ishlaydi
    entries.style.maxHeight = entries.scrollHeight + 'px';
    requestAnimationFrame(() => {
      entries.style.maxHeight = '0px';
      dayEl.classList.remove('open');
    });
  }

  // Ochiq turgan kun scroll bilan ekrandan butunlay chiqib ketsa — avtomatik yopamiz.
  // IntersectionObserver = elementning ekranda ko'rinib-ko'rinmasligini kuzatuvchi vosita.
  function setupDayObserver() {
    if (dayObserver) dayObserver.disconnect();
    dayObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const sana = entry.target.dataset.sana;
        if (!entry.isIntersecting && sana === openSana) {
          closeDay(entry.target);
          openSana = null;
        }
      });
    }, { threshold: 0 });
    logEl.querySelectorAll('.day').forEach(el => dayObserver.observe(el));
  }

  function render(docs) {
    updateHabit(docs);
    if (docs.length === 0) {
      logEl.innerHTML = `<div class="state">hali yozuv yo'q.</div>`;
      return;
    }

    // 1) yozuvlarni sana bo'yicha guruhlaymiz
    const kunlar = new Map(); // sana -> [{soat, holat}]
    for (const d of docs) {
      const f = d.data();
      const vaqt = f.vaqt || '';
      const [sana, soat] = vaqt.includes(' ') ? vaqt.split(' ') : [vaqt, ''];
      if (!kunlar.has(sana)) kunlar.set(sana, []);
      kunlar.get(sana).push({ soat, holat: f.holat || '' });
    }

    // 2) har bir kun uchun yopiq qator + ichida (yashirin) yozuvlar ro'yxati
    let html = '';
    for (const [sana, yozuvlar] of kunlar) {
      html += `<div class="day" data-sana="${esc(sana)}">`;
      html += `<div class="day-row">`;
      html += `<div class="day-date">${esc(sana)}</div>`;
      html += `<div class="day-count">${yozuvlar.length} ta status</div>`;
      html += `<div class="day-arrow">›</div>`;
      html += `</div>`;
      html += `<div class="day-entries">`;
      for (const y of yozuvlar) {
        html += `<div class="entry"><div class="ts">${esc(y.soat)}</div><div class="holat">${esc(y.holat)}</div></div>`;
      }
      html += `</div></div>`;
    }
    logEl.innerHTML = html;

    // Yangi status kelib qayta chizilganda, agar biror kun ochiq bo'lsa —
    // uni animatsiyasiz, darhol ochiq holatda tiklaymiz (jump/glitch bo'lmasin uchun).
    if (openSana) {
      const dayEl = logEl.querySelector(`.day[data-sana="${CSS.escape(openSana)}"]`);
      if (dayEl) {
        const entries = dayEl.querySelector('.day-entries');
        entries.style.transition = 'none';
        dayEl.classList.add('open');
        entries.style.maxHeight = entries.scrollHeight + 'px';
        void entries.offsetHeight; // reflow'ni majburlab, transitionni xavfsiz qaytaramiz
        entries.style.transition = '';
      } else {
        openSana = null;
      }
    }

    setupDayObserver();
  }

  // Qator bosilganda — bitta kun ochiladi, oldin ochiq turgani bo'lsa avtomatik yopiladi.
  logEl.addEventListener('click', (e) => {
    const row = e.target.closest('.day-row');
    if (!row) return;
    const dayEl = row.closest('.day');
    const sana = dayEl.dataset.sana;

    if (openSana === sana) {
      closeDay(dayEl);
      openSana = null;
      return;
    }

    if (openSana) {
      const prevEl = logEl.querySelector(`.day[data-sana="${CSS.escape(openSana)}"]`);
      if (prevEl) closeDay(prevEl);
    }
    openDay(dayEl);
    openSana = sana;
  });

  // ---- DARS JADVALI: ixcham grid, katakka bosib yoziladi, 5s jimlikdan keyin avto-saqlanadi ----
  const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const ROWS = 8;
  const tabsEl = document.getElementById('tabs');
  const panelStatusEl = document.getElementById('panelStatus');
  const panelJadvalEl = document.getElementById('panelJadval');
  const jadvalBodyEl = document.getElementById('jadvalBody');
  const jadvalStateEl = document.getElementById('jadvalState');

  (function buildJadvalGrid() {
    let html = '';
    for (let i = 1; i <= ROWS; i++) {
      html += `<tr><td class="rownum">${i}</td>`;
      for (const d of DAYS) html += `<td><div class="cell" contenteditable="true" data-key="${d}_${i}"></div></td>`;
      html += '</tr>';
    }
    jadvalBodyEl.innerHTML = html;
  })();

  let jadvalLoaded = false;
  let jadvalTimer = null;
  let jadvalDirty = false;
  let jadvalSaving = false;

  tabsEl.addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (!b) return;
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
    const showJadval = b.dataset.tab === 'jadval';
    panelStatusEl.hidden = showJadval;
    panelJadvalEl.hidden = !showJadval;
    if (showJadval) loadJadval(jadvalLoaded);
  });

  function readJadvalCells() {
    const cells = {};
    jadvalBodyEl.querySelectorAll('.cell').forEach(el => {
      const v = el.textContent.trim();
      if (v) cells[el.dataset.key] = v;
    });
    return cells;
  }

  // silent=true: fon yangilash (Claude jadvalni o'zgartirgan bo'lishi mumkin). Yozilayotgan yoki saqlanayotgan
  // bo'lsa, ustidan yozmaydi, chunki sayt saqlashda butun gridni yuboradi.
  async function loadJadval(silent) {
    if (!unlocked) return;
    jadvalLoaded = true;
    if (!silent) {
      jadvalStateEl.textContent = 'yuklanmoqda...';
      jadvalStateEl.className = 'jadval-state';
    }
    try {
      const { r, data } = await api('/api/jadval');
      if (r.status === 401) { showGate('sessiya tugadi, qayta kir', 'err'); return; }
      if (!r.ok) throw new Error(data.error || r.status);
      if (jadvalDirty || jadvalSaving) return;
      const cells = data.cells || {};
      jadvalBodyEl.querySelectorAll('.cell').forEach(el => {
        const v = cells[el.dataset.key] || '';
        if (el.textContent !== v) el.textContent = v;
      });
      if (!silent) jadvalStateEl.textContent = '';
    } catch (err) {
      if (silent) return;
      jadvalStateEl.textContent = `xato: ${err.message || err}`;
      jadvalStateEl.className = 'jadval-state err';
    }
  }

  // Jadval tab'i ochiq tursa, har 10 soniyada jimgina yangilanadi (Claude o'zgartirsa ko'rinadi).
  setInterval(() => {
    if (!unlocked || panelJadvalEl.hidden || document.hidden) return;
    if (jadvalDirty || jadvalSaving || document.activeElement?.closest?.('.cell')) return;
    loadJadval(true);
  }, 10000);

  async function saveJadval() {
    if (jadvalSaving) { jadvalTimer = setTimeout(saveJadval, 1000); return; }
    jadvalSaving = true;
    jadvalDirty = false;
    jadvalStateEl.textContent = 'saqlanmoqda...';
    jadvalStateEl.className = 'jadval-state saving';
    try {
      const { r, data } = await api('/api/jadval', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cells: readJadvalCells() }),
      });
      if (r.status === 401) { showGate('sessiya tugadi, qayta kir', 'err'); return; }
      if (!r.ok) throw new Error(data.error || r.status);
      jadvalStateEl.textContent = 'saqlandi ✓';
      jadvalStateEl.className = 'jadval-state saved';
    } catch (err) {
      jadvalStateEl.textContent = `saqlanmadi: ${err.message || err} — qayta urinilmoqda`;
      jadvalStateEl.className = 'jadval-state err';
      jadvalDirty = true;
      jadvalTimer = setTimeout(saveJadval, 5000);
    } finally {
      jadvalSaving = false;
    }
  }

  jadvalBodyEl.addEventListener('input', (e) => {
    if (!e.target.closest('.cell')) return;
    jadvalDirty = true;
    jadvalStateEl.textContent = 'yozilmoqda...';
    jadvalStateEl.className = 'jadval-state';
    if (jadvalTimer) clearTimeout(jadvalTimer);
    jadvalTimer = setTimeout(saveJadval, 5000);
  });

  // Enter — keyingi qatorga tushirmaydi, shunchaki katakdan chiqadi (jadval bir qatorli bo'lib qolsin).
  jadvalBodyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.closest('.cell')) { e.preventDefault(); e.target.blur(); }
  });

  // Sahifadan chiqishda hali saqlanmagan o'zgarish bo'lsa, oxirgi holatni beacon bilan yuboramiz.
  window.addEventListener('pagehide', () => {
    if (jadvalDirty && unlocked) {
      try {
        navigator.sendBeacon('/api/jadval', new Blob([JSON.stringify({ cells: readJadvalCells() })], { type: 'application/json' }));
      } catch { /* beacon ishlamasa ham sahifa yopilishini to'xtatmaymiz */ }
    }
  });

  // ---- AUTH OQIMI ----
  // Login server orqali (/api/login): sayt ham, /mcp ham bitta eshikdan kiradi, IP hisobi ham bitta.
  // Sessiya = serverdan kelgan httpOnly cookie. Brauzerda localStorage/sessionStorage/IndexedDB ishlatilmaydi,
  // JavaScript cookie'ni o'qiy olmaydi. Email/parol hech qayerda saqlanmaydi.
  let unlocked = false;
  let pollTimer = null;
  let loading = false;

  const api = async (path, opts = {}) => {
    const r = await fetch(path, { credentials: 'same-origin', cache: 'no-store', ...opts });
    const data = await r.json().catch(() => ({}));
    // IP bloklangan bo'lsa (istalgan so'rovda, ochiq turgan sessiyada ham) darhol bloklangan ekran + orqaga sanash.
    if (r.status === 403 && data.error === 'bloklangan') showBlocked(data);
    return { r, data };
  };

  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function showGate(msg = 'Kirish', kind = '') {
    unlocked = false;
    stopPolling();
    contentEl.style.display = 'none';
    gateEl.style.display = 'flex';
    loginFormEl.style.display = 'flex';
    gateStateEl.textContent = msg;
    gateStateEl.className = 'state' + (kind ? ' ' + kind : '');
    logEl.innerHTML = '';
    prevTodayHas = null;
    emailInputEl.value = '';
    passInputEl.value = '';
    emailInputEl.focus();
    if (jadvalTimer) { clearTimeout(jadvalTimer); jadvalTimer = null; }
    jadvalLoaded = false;
    jadvalDirty = false;
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'status'));
    panelStatusEl.hidden = false;
    panelJadvalEl.hidden = true;
  }

  // Qolgan soniyani odam o'qiydigan ko'rinishga o'giradi: "1 yil 12 kun 3 soat 20 daqiqa 15 soniya"
  function fmtLeft(total) {
    let s = Math.max(0, Math.floor(total));
    const Y = 31536000, D = 86400;
    const y = Math.floor(s / Y); s -= y * Y;
    const d = Math.floor(s / D); s -= d * D;
    const hh = Math.floor(s / 3600); s -= hh * 3600;
    const mm = Math.floor(s / 60); s -= mm * 60;
    const parts = [];
    if (y) parts.push(`${y} yil`);
    if (d) parts.push(`${d} kun`);
    if (hh) parts.push(`${hh} soat`);
    if (mm) parts.push(`${mm} daqiqa`);
    parts.push(`${s} soniya`);
    return parts.join(' ');
  }

  // Blok IP bo'yicha serverda turadi, shuning uchun sahifani yangilasang ham, boshqa brauzer yoki qurilmadan
  // kirsang ham (shu IP'dan) qolgan vaqt server javobidan qayta olinadi va orqaga sanash davom etadi.
  let blockTimer = null;
  function showBlocked(info = {}) {
    unlocked = false;
    stopPolling();
    if (blockTimer) { clearInterval(blockTimer); blockTimer = null; }
    contentEl.style.display = 'none';
    gateEl.style.display = 'flex';
    loginFormEl.style.display = 'none';
    gateStateEl.className = 'state err';
    if (info.permanent || !Number.isFinite(info.retry_after_sec)) {
      gateStateEl.textContent = 'IP manzilingiz bloklangan';
      return;
    }
    // Faqat farqdan foydalanamiz (serverdan kelgan qolgan soniya + brauzerdagi o'tgan vaqt): brauzer soati noto'g'ri bo'lsa ham xato bo'lmaydi.
    const endAt = performance.now() + info.retry_after_sec * 1000;
    const tick = () => {
      const left = Math.ceil((endAt - performance.now()) / 1000);
      if (left <= 0) {
        clearInterval(blockTimer); blockTimer = null;
        recheckAfterBlock();
        return;
      }
      gateStateEl.textContent = `IP manzilingiz bloklandi. Ochilishiga: ${fmtLeft(left)}`;
    };
    tick();
    blockTimer = setInterval(tick, 1000);
  }

  // Sanash tugadi: serverdan holatni so'raymiz. Ochilgan bo'lsa saytga (sessiya bor bo'lsa) yoki login formasiga qaytamiz.
  async function recheckAfterBlock() {
    try {
      const { data } = await api('/api/login');
      if (data.blocked) { showBlocked(data); return; }
      if (data.authed) unlockApp(); else showGate();
    } catch {
      showBlocked({ retry_after_sec: 5 });
    }
  }

  // Server yozuvlarini eski render() kutgan shaklga o'giramiz
  const asDocs = (items) => items.map(x => ({
    data: () => ({ vaqt: x.vaqt, holat: x.holat, timestamp: { toDate: () => new Date(x.ts || Date.now()) } })
  }));

  async function loadLog() {
    if (loading || !unlocked) return;
    loading = true;
    try {
      const { r, data } = await api('/api/checkins');
      if (r.status === 401) { showGate('sessiya tugadi, qayta kir', 'err'); return; }
      if (!r.ok) throw new Error(data.error || r.status);
      render(asDocs(data.items || []));
    } catch (err) {
      if (unlocked && !logEl.querySelector('.day')) {
        logEl.innerHTML = `<div class="state err">xato: ma'lumot yuklanmadi (${esc(String(err.message || err))})</div>`;
      }
    } finally {
      loading = false;
    }
  }

  function unlockApp() {
    if (unlocked) return;
    unlocked = true;
    gateEl.style.display = 'none';
    contentEl.style.display = 'block';
    loadLog();
    // "jonli" yangilanish: sahifa ochiq va ko'rinib turgan paytda har 10 soniyada
    pollTimer = setInterval(() => { if (!document.hidden) loadLog(); }, 10000);
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden && unlocked) loadLog(); });

  loginFormEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInputEl.value.trim();
    const pass = passInputEl.value;
    if (!email || !pass) return;

    passBtnEl.disabled = true;
    gateStateEl.textContent = 'tekshirilmoqda...';
    gateStateEl.className = 'state';
    try {
      const { r, data } = await api('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass }),
      });
      emailInputEl.value = '';
      passInputEl.value = '';
      if (r.ok) { unlockApp(); return; }
      if (r.status === 403) return; // api() bloklangan ekranni va orqaga sanashni allaqachon ko'rsatdi
      let msg = "email yoki parol noto'g'ri";
      if (r.status === 401 && data.unlimited) msg += ". Eshik ochiq, limit yo'q: qayta urinaver";
      else if (r.status === 401 && data.attempts_left) msg += `. ${data.attempts_left} ta urinish qoldi`;
      else if (r.status === 429) msg = "juda ko'p so'rov, bir necha soniyadan keyin qayta urin";
      else if (r.status >= 500) msg = `server xatosi: ${data.error || r.status}`;
      gateStateEl.textContent = msg;
      gateStateEl.className = 'state err';
    } catch {
      passInputEl.value = '';
      gateStateEl.textContent = "server bilan bog'lanib bo'lmadi";
      gateStateEl.className = 'state err';
    } finally {
      passBtnEl.disabled = false;
    }
  });

  logoutBtnEl.addEventListener('click', async () => {
    await api('/api/logout', { method: 'POST' }).catch(() => {});
    showGate('chiqding');
  });

  // Yangi yozuv (forma bir marta ulanadi)
  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!unlocked) return;
    let holat = inputEl.value.trim();
    if (!holat) return;
    if (energy && !/\s:[1-5]$/.test(holat)) holat += ` :${energy}`;

    btnEl.disabled = true;
    formStateEl.textContent = '';
    formStateEl.className = 'state';

    try {
      const { r, data } = await api('/api/checkins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ holat }),
      });
      if (r.status === 401) { showGate('sessiya tugadi, qayta kir', 'err'); return; }
      if (!r.ok) throw new Error(data.error || r.status);
      inputEl.value = '';
      resetEnergy();
      formStateEl.textContent = 'yuborildi ✓';
      formStateEl.className = 'state ok';
      setTimeout(() => { formStateEl.textContent = ''; }, 2000);
      loadLog();
    } catch (err) {
      formStateEl.textContent = `xato: ${err.message}`;
      formStateEl.className = 'state err';
    } finally {
      btnEl.disabled = false;
      inputEl.focus();
    }
  });

  // Ochilganda: sessiya cookie bormi / IP bloklanganmi?
  (async () => {
    try {
      const { data } = await api('/api/login');
      if (data.blocked) showBlocked(data);
      else if (data.authed) unlockApp();
      else showGate();
    } catch {
      showGate("server bilan bog'lanib bo'lmadi", 'err');
    }
  })();
</script>
</body>
</html>
