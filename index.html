<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MRstatus</title>
<meta name="application-name" content="MRstatus">
<meta name="apple-mobile-web-app-title" content="MRstatus">
<meta name="theme-color" content="#0a0c0b">
<meta name="description" content="MRstatus">
<link rel="icon" type="image/svg+xml" href="/logo/logo.svg">
<link rel="alternate icon" type="image/x-icon" sizes="48x48" href="/logo/logo.ico">
<link rel="apple-touch-icon" href="/logo/logo-180.png">
<link rel="manifest" href="/logo/site.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0b;
    --panel: #101413;
    --border: #202826;
    --border-soft: #171c1a;
    --text: #eef2ef;
    --text-dim: #7c8883;
    --text-faint: #4c5652;
    --accent: #7fe0a0;
    --accent-dim: rgba(127, 224, 160, .1);
    --red: #f2726f;
    --red-dim: rgba(242, 114, 111, .1);
    --radius: 14px;
    --radius-sm: 8px;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html {
    /* fluid type scale — ekran kengligiga qarab silliq o'sadi/kichrayadi,
       qat'iy breakpoint'larga tayanmasdan har qanday device'da tekis ko'rinadi */
    font-size: clamp(14px, 3.6vw, 16px);
  }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-text-size-adjust: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(127, 224, 160, .05), transparent 60%),
      var(--bg);
  }

  ::selection { background: var(--accent-dim); color: var(--accent); }

  a, button, input, .day-row { -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(20px, 6vw, 56px) clamp(14px, 4vw, 20px) clamp(40px, 8vw, 72px);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .6);
    padding: clamp(16px, 4vw, 26px);
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: clamp(18px, 4vw, 26px);
  }

  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--text-dim);
    background: var(--bg);
  }

  h1 {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--text);
    margin: 0;
    letter-spacing: .01em;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-dim);
    flex-shrink: 0;
    animation: pulse 2.4s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(127, 224, 160, .35); }
    70%  { box-shadow: 0 0 0 7px rgba(127, 224, 160, 0); }
    100% { box-shadow: 0 0 0 0 rgba(127, 224, 160, 0); }
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: .9rem;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .15s ease;
  }
  input[type="text"]::placeholder { color: var(--text-faint); }
  input[type="text"]:hover { border-color: var(--text-faint); }
  input[type="text"]:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #08130c;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 700;
    padding: 11px 18px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .15s ease, transform .08s ease;
  }
  button:hover { opacity: .88; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; transform: none; }

  #gate button, #gate input { width: 100%; }
  #gate button {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border);
  }
  #gate button:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

  .divider {
    height: 1px;
    background: var(--border-soft);
    margin: 18px 0 4px;
  }

  .day { border-bottom: 1px solid var(--border-soft); }
  .day:last-child { border-bottom: none; }

  .day-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 4px;
    margin: 0 -4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: background-color .15s ease;
  }
  .day-row:hover { background: rgba(255, 255, 255, .025); }
  .day-row:active { background: rgba(255, 255, 255, .045); }

  .day-date {
    color: var(--text);
    font-size: .9rem;
    font-weight: 700;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .day.open .day-date { color: var(--accent); }

  .day-count {
    color: var(--text-dim);
    font-size: .8rem;
    flex: 1;
  }

  .day-arrow {
    color: var(--text-faint);
    font-size: .85rem;
    transition: transform .25s ease, color .15s ease;
    flex-shrink: 0;
  }
  .day.open .day-arrow { transform: rotate(90deg); color: var(--accent); }

  .day-entries {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    padding-bottom: 6px;
    transition: max-height .32s cubic-bezier(.4, 0, .2, 1), opacity .28s ease;
  }
  .day.open .day-entries { opacity: 1; }

  .entry {
    display: flex;
    gap: 14px;
    padding: 9px 0 9px 14px;
    border-left: 2px solid var(--border);
    margin-left: 3px;
    font-size: .875rem;
    line-height: 1.5;
  }

  .ts {
    color: var(--text-faint);
    white-space: nowrap;
    flex-shrink: 0;
    width: 48px;
    font-variant-numeric: tabular-nums;
  }

  .holat {
    color: var(--text);
    word-break: break-word;
    min-width: 0;
  }

  .state {
    color: var(--text-dim);
    font-size: .82rem;
    padding: 8px 4px;
  }
  .state.err { color: var(--red); }
  .state.ok { color: var(--accent); }
  .hint { font-size: .75rem; color: var(--text-faint); padding-top: 12px; }


  /* ---- odat qatlami: kunlik ritm, eslatma, tez yozish ---- */
  .week { margin: 0 0 16px; }
  .week-dots { display: flex; gap: 8px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .wd i {
    width: 100%; max-width: 34px; height: 10px; border-radius: 5px;
    background: var(--border-soft); border: 1px solid var(--border);
    transition: background-color .25s ease, border-color .25s ease;
  }
  .wd.on i { background: var(--accent); border-color: var(--accent); }
  .wd.today i { border-color: var(--text-dim); }
  .wd.today.on i { border-color: var(--accent); }
  .wd.pop i { animation: pop .5s ease-out; }
  .wd span { font-size: .65rem; color: var(--text-faint); }
  .wd.today span { color: var(--text-dim); }
  @keyframes pop { 0% { transform: scaleY(1); } 40% { transform: scaleY(1.9); } 100% { transform: scaleY(1); } }
  .week-note { margin-top: 10px; font-size: .78rem; color: var(--text-dim); min-height: 1.2em; }

  .nudge {
    margin: 0 0 12px; padding: 9px 12px; font-size: .82rem; color: var(--accent);
    background: var(--accent-dim); border: 1px solid rgba(127, 224, 160, .25); border-radius: var(--radius-sm);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .chip {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    font-size: .78rem; font-weight: 500; padding: 6px 10px; border-radius: 999px;
  }
  .chip:hover { border-color: var(--text-faint); color: var(--text); opacity: 1; }
  .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .chips.energy { align-items: center; }
  .chips.energy .lbl { font-size: .75rem; color: var(--text-faint); margin-right: 2px; }
  .chips.energy .chip { min-width: 34px; text-align: center; }

  #gate {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #content { display: none; }

  @media (max-width: 420px) {
    .entry { flex-direction: column; gap: 3px; padding-left: 12px; }
    .ts { width: auto; }
    .day-count { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="topbar">
      <div class="badge">MR</div>
      <h1><span>MRstatus</span><span class="live-dot" aria-hidden="true"></span></h1>
    </div>

    <div id="gate">
      <div class="state" id="gateState">tekshirilmoqda...</div>
      <input type="password" id="passInput" placeholder="parol" autocomplete="off" style="display:none">
      <button id="passBtn" style="display:none">kir</button>
    </div>

    <div id="content">
      <div class="week" id="week" hidden>
        <div class="week-dots" id="weekDots"></div>
        <div class="week-note" id="weekNote"></div>
      </div>
      <div class="nudge" id="nudge" hidden></div>

      <form id="statusForm">
        <input type="text" id="holatInput" placeholder="holatingni yoz..." autocomplete="off" maxlength="490" required>
        <button type="submit" id="submitBtn">yubor</button>
      </form>
      <div class="chips" id="phraseChips">
        <button type="button" class="chip" data-t="kod yozyapman">kod yozyapman</button>
        <button type="button" class="chip" data-t="yangi loyiha ustidaman">yangi loyiha</button>
        <button type="button" class="chip" data-t="dam olyapman">dam olyapman</button>
        <button type="button" class="chip" data-t="maktabdan keldim">maktabdan keldim</button>
        <button type="button" class="chip" data-t="charchadim">charchadim</button>
      </div>
      <div class="chips energy" id="energyChips" role="group" aria-label="energiya">
        <span class="lbl">energiya</span>
        <button type="button" class="chip" data-e="1">1</button>
        <button type="button" class="chip" data-e="2">2</button>
        <button type="button" class="chip" data-e="3">3</button>
        <button type="button" class="chip" data-e="4">4</button>
        <button type="button" class="chip" data-e="5">5</button>
      </div>

      <div id="formState" class="state"></div>
      <div class="divider"></div>
      <div id="log">
        <div class="state">yuklanmoqda...</div>
      </div>
      <div class="state hint">kun ustiga bosilsa, o'sha kun statuslari ochiladi</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAnalytics, isSupported as analyticsSupported } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, orderBy, limit, onSnapshot, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // Your web app's Firebase configuration
  // apiKey: Security Rules tarafindan himoya qilinadi — bu public bo'lishi mumkin
  const firebaseConfig = {
    apiKey: "AIzaSyAvvkcbKlbrplbh29m2MmVfiypvlGAEglg", // Firebase Security Rules himoya qiladi
    authDomain: "mrabout.firebaseapp.com",
    projectId: "mrabout",
    storageBucket: "mrabout.firebasestorage.app",
    messagingSenderId: "544262128836",
    appId: "1:544262128836:web:f6c54edcaf50fa1c8eb591",
    measurementId: "G-KLJNX0F23T"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Analytics faqat https/real domain'da ishlaydi, file:// yoki localhost'da jim tarzda o'chadi
  analyticsSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});

  const logEl = document.getElementById('log');
  const formEl = document.getElementById('statusForm');
  const inputEl = document.getElementById('holatInput');
  const btnEl = document.getElementById('submitBtn');
  const formStateEl = document.getElementById('formState');
  const contentEl = document.getElementById('content');
  const gateEl = document.getElementById('gate');
  const gateStateEl = document.getElementById('gateState');
  const passInputEl = document.getElementById('passInput');
  const passBtnEl = document.getElementById('passBtn');

  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function esc(s) {
    const d = document.createElement('div');
    d.innerText = s;
    return d.innerHTML;
  }

  // ---- ODAT QATLAMI ----
  // Kun chegarasi (guide bilan bir xil): 00:00-04:59 dagi yozuv oldingi kunning davomi.
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const WD = ['Y', 'D', 'S', 'C', 'P', 'J', 'S']; // yak, dush, sesh, chor, pay, jum, shan

  function logicalDay(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (d.getHours() < 5) x.setDate(x.getDate() - 1);
    return x;
  }

  function dayKeyOf(vaqt) {
    const m = /^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/.exec(vaqt || '');
    if (!m) return null;
    return ymd(logicalDay(new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5])));
  }

  let prevTodayHas = null; // bugungi nuqta yangi to'lganda bir marta animatsiya qilish uchun

  function updateHabit(docs) {
    const weekEl = document.getElementById('week');
    const dotsEl = document.getElementById('weekDots');
    const noteEl = document.getElementById('weekNote');
    const nudgeEl = document.getElementById('nudge');
    const now = new Date();

    // kunlar bo'yicha sanash + energiya belgilari (:1-:5)
    const perDay = new Map();
    const marks = new Map(); // kun -> [energiya]
    for (const d of docs) {
      const f = d.data();
      const k = dayKeyOf(f.vaqt);
      if (!k) continue;
      perDay.set(k, (perDay.get(k) || 0) + 1);
      const m = /\s:([1-5])\s*$/.exec(f.holat || '');
      if (m) { if (!marks.has(k)) marks.set(k, []); marks.get(k).push(+m[1]); }
    }

    // oxirgi 7 mantiqiy kun (eskisi chapda, bugun o'ngda)
    const today = logicalDay(now);
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      days.push({ key: ymd(d), wd: WD[d.getDay()], isToday: i === 0 });
    }
    const todayHas = (perDay.get(days[6].key) || 0) > 0;
    dotsEl.innerHTML = days.map(x => {
      const on = (perDay.get(x.key) || 0) > 0;
      const pop = x.isToday && on && prevTodayHas === false ? ' pop' : '';
      return `<div class="wd${on ? ' on' : ''}${x.isToday ? ' today' : ''}${pop}" title="${x.key}"><i></i><span>${x.wd}</span></div>`;
    }).join('');
    prevTodayHas = todayHas;

    const n = days.filter(x => perDay.get(x.key)).length;
    const vals = days.flatMap(x => marks.get(x.key) || []);
    let note = `${n}/7 kun`;
    if (vals.length >= 3) note += ` · energiya ~${(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1)}`;
    noteEl.textContent = note;
    weekEl.hidden = false;

    // eslatma: faqat sening tanish paytlaringda (maktabdan keyin, kech kechqurun), bosimsiz
    let last = null;
    if (docs.length) {
      const ts = docs[0].data().timestamp;
      last = ts && ts.toDate ? ts.toDate() : now;
    }
    const hrs = last ? (now - last) / 36e5 : Infinity;
    const h = now.getHours();
    let msg = '';
    if (now.getDay() !== 0 && h >= 13 && h < 17 && hrs > 4) msg = 'uyga keldingmi? bitta holat yoz.';
    else if (h >= 20 && h < 23 && hrs > 3) msg = 'kunni yopamiz: bitta jumla yoz.';
    nudgeEl.hidden = !msg;
    nudgeEl.textContent = msg;
  }

  // tez yozish: tugmalar inputni to'ldiradi, energiya belgisi yuborishda ' :N' bo'lib qo'shiladi
  let energy = 0;
  document.getElementById('phraseChips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const inp = document.getElementById('holatInput');
    inp.value = inp.value.trim() ? `${inp.value.trim()}, ${b.dataset.t}` : b.dataset.t;
    inp.focus();
  });
  document.getElementById('energyChips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const v = +b.dataset.e;
    energy = energy === v ? 0 : v;
    document.querySelectorAll('#energyChips .chip').forEach(c => c.classList.toggle('on', +c.dataset.e === energy));
    document.getElementById('holatInput').focus();
  });
  function resetEnergy() {
    energy = 0;
    document.querySelectorAll('#energyChips .chip').forEach(c => c.classList.remove('on'));
  }

  // Bir vaqtda faqat bitta kun ochiq turadi (accordion).
  // openSana = hozir ochiq turgan kunning sanasi, yoki hech qaysi ochiq bo'lmasa null.
  let openSana = null;
  let dayObserver = null;

  // Kunni animatsiya bilan ochish: max-height ni 0 dan haqiqiy balandlikkacha o'tkazamiz —
  // shunda transition CSS'dagi "smooth" effekt beradi, sakrash bo'lmaydi.
  function openDay(dayEl) {
    const entries = dayEl.querySelector('.day-entries');
    dayEl.classList.add('open');
    entries.style.maxHeight = entries.scrollHeight + 'px';
  }

  // Kunni animatsiya bilan yopish.
  function closeDay(dayEl) {
    const entries = dayEl.querySelector('.day-entries');
    // avval hozirgi balandlikni "qattiq" raqam qilib qo'yamiz (auto emas),
    // shundagina 0 ga transition silliq ishlaydi
    entries.style.maxHeight = entries.scrollHeight + 'px';
    requestAnimationFrame(() => {
      entries.style.maxHeight = '0px';
      dayEl.classList.remove('open');
    });
  }

  // Ochiq turgan kun scroll bilan ekrandan butunlay chiqib ketsa — avtomatik yopamiz.
  // IntersectionObserver = elementning ekranda ko'rinib-ko'rinmasligini kuzatuvchi vosita.
  function setupDayObserver() {
    if (dayObserver) dayObserver.disconnect();
    dayObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const sana = entry.target.dataset.sana;
        if (!entry.isIntersecting && sana === openSana) {
          closeDay(entry.target);
          openSana = null;
        }
      });
    }, { threshold: 0 });
    logEl.querySelectorAll('.day').forEach(el => dayObserver.observe(el));
  }

  function render(docs) {
    updateHabit(docs);
    if (docs.length === 0) {
      logEl.innerHTML = `<div class="state">hali yozuv yo'q.</div>`;
      return;
    }

    // 1) yozuvlarni sana bo'yicha guruhlaymiz
    const kunlar = new Map(); // sana -> [{soat, holat}]
    for (const d of docs) {
      const f = d.data();
      const vaqt = f.vaqt || '';
      const [sana, soat] = vaqt.includes(' ') ? vaqt.split(' ') : [vaqt, ''];
      if (!kunlar.has(sana)) kunlar.set(sana, []);
      kunlar.get(sana).push({ soat, holat: f.holat || '' });
    }

    // 2) har bir kun uchun yopiq qator + ichida (yashirin) yozuvlar ro'yxati
    let html = '';
    for (const [sana, yozuvlar] of kunlar) {
      html += `<div class="day" data-sana="${esc(sana)}">`;
      html += `<div class="day-row">`;
      html += `<div class="day-date">${esc(sana)}</div>`;
      html += `<div class="day-count">${yozuvlar.length} ta status</div>`;
      html += `<div class="day-arrow">›</div>`;
      html += `</div>`;
      html += `<div class="day-entries">`;
      for (const y of yozuvlar) {
        html += `<div class="entry"><div class="ts">${esc(y.soat)}</div><div class="holat">${esc(y.holat)}</div></div>`;
      }
      html += `</div></div>`;
    }
    logEl.innerHTML = html;

    // Yangi status kelib qayta chizilganda, agar biror kun ochiq bo'lsa —
    // uni animatsiyasiz, darhol ochiq holatda tiklaymiz (jump/glitch bo'lmasin uchun).
    if (openSana) {
      const dayEl = logEl.querySelector(`.day[data-sana="${CSS.escape(openSana)}"]`);
      if (dayEl) {
        const entries = dayEl.querySelector('.day-entries');
        entries.style.transition = 'none';
        dayEl.classList.add('open');
        entries.style.maxHeight = entries.scrollHeight + 'px';
        void entries.offsetHeight; // reflow'ni majburlab, transitionni xavfsiz qaytaramiz
        entries.style.transition = '';
      } else {
        openSana = null;
      }
    }

    setupDayObserver();
  }

  // Qator bosilganda — bitta kun ochiladi, oldin ochiq turgani bo'lsa avtomatik yopiladi.
  logEl.addEventListener('click', (e) => {
    const row = e.target.closest('.day-row');
    if (!row) return;
    const dayEl = row.closest('.day');
    const sana = dayEl.dataset.sana;

    if (openSana === sana) {
      closeDay(dayEl);
      openSana = null;
      return;
    }

    if (openSana) {
      const prevEl = logEl.querySelector(`.day[data-sana="${CSS.escape(openSana)}"]`);
      if (prevEl) closeDay(prevEl);
    }
    openDay(dayEl);
    openSana = sana;
  });

  function unlockApp() {
    gateEl.style.display = 'none';
    contentEl.style.display = 'block';

    // Real-vaqtda tinglash — yangi yozuv kelsa avtomatik yangilanadi
    const q = query(collection(db, "checkins"), orderBy("timestamp", "desc"), limit(300));
    onSnapshot(q, snap => {
      render(snap.docs);
    }, err => {
      logEl.innerHTML = `<div class="state err">xato: ma'lumot yuklanmadi (${esc(err.message)})</div>`;
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      let holat = inputEl.value.trim();
      if (!holat) return;
      if (energy && !/\s:[1-5]$/.test(holat)) holat += ` :${energy}`;

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const vaqt = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

      btnEl.disabled = true;
      formStateEl.textContent = '';
      formStateEl.className = 'state';

      try {
        await addDoc(collection(db, "checkins"), {
          vaqt,
          holat,
          timestamp: serverTimestamp(),
        });
        inputEl.value = '';
        resetEnergy();
        formStateEl.textContent = 'yuborildi ✓';
        formStateEl.className = 'state ok';
        setTimeout(() => { formStateEl.textContent = ''; }, 2000);
      } catch (err) {
        formStateEl.textContent = `xato: ${err.message}`;
        formStateEl.className = 'state err';
      } finally {
        btnEl.disabled = false;
        inputEl.focus();
      }
    });
  }

  async function checkPassword(candidate, correctHash) {
    const h = await sha256Hex(candidate);
    return h === correctHash;
  }

  async function runGate() {
    // 1) auth kerak — yozish (checkins) anonim token talab qiladi
    await new Promise(resolve => {
      const unsub = onAuthStateChanged(auth, user => {
        if (user) { unsub(); resolve(); }
      });
    });

    // 2) sessiyada allaqachon ochilganmi tekshir (shu tab uchun, reload'da qayta so'ramasin)
    const sessionUnlocked = sessionStorage.getItem('mrstatus_unlocked') === '1';

    let correctHash = null;
    try {
      const snap = await getDoc(doc(db, "config", "access"));
      if (snap.exists()) correctHash = snap.data().hash || null;
    } catch (err) {
      gateStateEl.textContent = `config o'qishda xato: ${err.message}`;
      gateStateEl.className = 'state err';
      return;
    }

    // Parol hali o'rnatilmagan bo'lsa — himoyasiz, to'g'ridan-to'g'ri kiritamiz
    if (!correctHash) {
      unlockApp();
      return;
    }

    if (sessionUnlocked) {
      unlockApp();
      return;
    }

    // 3) qo'lda kiritish formasini ko'rsat
    gateStateEl.textContent = 'parolni kiriting';
    passInputEl.style.display = 'block';
    passBtnEl.style.display = 'block';
    passInputEl.focus();

    async function trySubmit() {
      const val = passInputEl.value;
      if (!val) return;
      const ok = await checkPassword(val, correctHash);
      if (ok) {
        sessionStorage.setItem('mrstatus_unlocked', '1');
        unlockApp();
      } else {
        gateStateEl.textContent = "noto'g'ri parol";
        gateStateEl.className = 'state err';
        passInputEl.value = '';
      }
    }
    passBtnEl.addEventListener('click', trySubmit);
    passInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') trySubmit(); });
  }

  // Firestore Rules "request.auth != null" talab qiladi — shuning uchun
  // sahifa ochilishi bilan anonim token olamiz. Bu Firebase Console'da
  // Authentication → Sign-in method → Anonymous YOQILGAN bo'lishini talab qiladi.
  signInAnonymously(auth).catch(err => {
    gateStateEl.textContent = `auth xato: ${err.message}`;
    gateStateEl.className = 'state err';
  });

  runGate();
</script>
</body>
</html>
