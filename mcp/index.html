<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MRstatus · MCP</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0a0c0b">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="/logo/logo.svg">
<link rel="alternate icon" type="image/x-icon" sizes="48x48" href="/logo/logo.ico">
<link rel="apple-touch-icon" href="/logo/logo-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0b;
    --panel: #101413;
    --border: #202826;
    --text: #eef2ef;
    --text-dim: #7c8883;
    --text-faint: #4c5652;
    --accent: #7fe0a0;
    --red: #f2726f;
    --radius: 14px;
    --radius-sm: 8px;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { font-size: clamp(14px, 3.6vw, 16px); }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-text-size-adjust: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(127, 224, 160, .05), transparent 60%),
      var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  ::selection { background: rgba(127, 224, 160, .1); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: clamp(20px, 8vw, 88px) clamp(14px, 4vw, 20px) 40px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .6);
    padding: clamp(16px, 4vw, 24px);
  }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }

  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--bg);
  }

  h1 { font-size: 1.0625rem; font-weight: 700; margin: 0; }

  .state { margin: 0 0 12px; min-height: 1.2em; font-size: .8125rem; color: var(--text-dim); }
  .state.err { color: var(--red); }
  .state.ok  { color: var(--accent); }

  .field { display: flex; gap: 8px; }

  input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: .875rem;
  }
  input:focus { border-color: var(--accent); outline: none; }
  input[readonly] { color: var(--accent); }

  button {
    padding: 12px 16px;
    background: var(--accent);
    color: #06120a;
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: .8125rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .note { margin: 14px 0 0; font-size: .75rem; line-height: 1.6; color: var(--text-faint); }

  @media (max-width: 420px) { .field { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <header class="topbar">
      <span class="badge">MR</span>
      <h1>MCP connector</h1>
    </header>

    <p class="state" id="state" role="status" aria-live="polite">email va parolni kiriting</p>

    <form id="gate" autocomplete="off">
      <div class="field">
        <input id="email" name="email" type="email" placeholder="email" autocomplete="off" required>
      </div>
      <div class="field">
        <input id="pass" name="password" type="password" placeholder="parol" autocomplete="off" required>
        <button id="passBtn" type="submit">Ochish</button>
      </div>
    </form>

    <div id="reveal" hidden>
      <div class="field">
        <input id="mcpUrl" type="password" readonly spellcheck="false" autocomplete="off" aria-label="Connector URL">
        <button id="copyBtn" type="button">Nusxa olish</button>
      </div>
      <p class="note">Claude → Settings → Connectors → Add custom connector. Name: mrstatus. URL: nusxa olingan manzil. Uni hech kimga yubormang.</p>
    </div>

    <noscript><p class="state err">Bu sahifa JavaScript'siz ishlamaydi.</p></noscript>
  </section>
</main>

<script>
  const AUTO_LOCK_MS = 60000; // manzil shuncha turadi, keyin o'zi yopiladi

  const $ = (id) => document.getElementById(id);
  const stateEl  = $('state');
  const gateEl   = $('gate');
  const emailEl  = $('email');
  const passEl   = $('pass');
  const passBtn  = $('passBtn');
  const revealEl = $('reveal');
  const urlEl    = $('mcpUrl');
  const copyBtn  = $('copyBtn');

  let lockTimer = null;

  function setState(text, kind = '') {
    stateEl.textContent = text;
    stateEl.className = 'state' + (kind ? ' ' + kind : '');
  }

  // Manzil faqat server parolni tasdiqlagandan keyin DOM'ga yoziladi.
  function showUrl(url) {
    urlEl.value = url;
    urlEl.type = 'password';
    gateEl.hidden = true;
    revealEl.hidden = false;
    setState("parol to'g'ri", 'ok');
    clearTimeout(lockTimer);
    lockTimer = setTimeout(() => lock('vaqt tugadi, manzil yopildi'), AUTO_LOCK_MS);
  }

  function lock(message = 'yopildi') {
    clearTimeout(lockTimer);
    lockTimer = null;
    urlEl.value = '';
    urlEl.type = 'password';
    passEl.value = '';
    revealEl.hidden = true;
    gateEl.hidden = false;
    setState(message);
    passEl.focus();
  }

  gateEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = passEl.value;
    const mail = emailEl.value.trim();
    if (!val || !mail) return;

    passBtn.disabled = true;
    setState('tekshirilmoqda…');
    try {
      const r = await fetch('/api/mcp-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: mail, password: val }),
        cache: 'no-store'
      });
      const data = await r.json().catch(() => ({}));
      passEl.value = '';
      emailEl.value = '';

      if (r.ok && data.url) {
        showUrl(data.url);
      } else if (r.status === 401) {
        setState("email yoki parol noto'g'ri", 'err');
      } else if (r.status === 429) {
        setState(`juda ko'p urinish. ${data.retry_after_sec || 60} soniya kuting`, 'err');
      } else {
        setState(`xato: ${data.error || r.status}`, 'err');
      }
    } catch {
      setState("server bilan bog'lanib bo'lmadi", 'err');
    } finally {
      passBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(urlEl.value);
      setState('nusxa olindi', 'ok');
    } catch {
      // Clipboard bloklangan bo'lsa: matnni ko'rsatib tanlaymiz, qo'lda ko'chirasan
      urlEl.type = 'text';
      urlEl.focus();
      urlEl.select();
      setState('avtomatik nusxa olinmadi. Matn tanlandi, Ctrl+C bos', 'err');
    }
  });

  // Sahifa fonga o'tsa (boshqa tab) ochiq manzil qolib ketmasin
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !revealEl.hidden) lock('sahifadan chiqding, manzil yopildi');
  });

  passEl.focus();
</script>
</body>
</html>
